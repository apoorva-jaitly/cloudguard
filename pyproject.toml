[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudguard"
version = "0.1.0"
description = "AI-assisted AWS architecture and production-readiness auditor"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.95",
    "fastapi>=0.116",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.13",
]

[project.scripts]
cloudguard-api = "cloudguard.api:run"

[tool.setuptools.packages.find]
where = ["src"]
